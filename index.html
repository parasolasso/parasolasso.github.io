<!DOCTYPE html>
<html lang="fr">
  <head>
    <!-- <script src="js/exit-instagram.js"></script> -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOUT LE MONDE DÉTESTE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    
    <div id="site-header"></div>
    
    <header>
      <img src="images/tlmd_LOGO_sqr.svg" alt="TLMD Logo" style="max-width: 250px; margin-bottom: 16px;">
      <p class="subtitle">— TLMD.FR —</p>
    </header>
    <main>
      <p class="section" style="margin-bottom: 12px;">ÉCOUTER LE DERNIER TITRE.</p>
      <div class="hot-block" id="hot-block"></div>
      <div class="buttons" id="listen-buttons"></div>

      <p class="section">ACTUALITÉS. 
        <a class="btn" href="agenda.html" rel="noopener" data-goatcounter-click="agenda" data-goatcounter-title="Agenda">
          <img src="https://api.iconify.design/mdi/calendar.svg?color=%23f5f5f5" alt="">
          Agenda
        </a></p>
      <div class="news-summary" id="news-summary"></div>
      <a class="carousel-indicator" id="news-indicator"></a>

      <p class="section">NOUS PROGRAMMER.</p>
      <div class="buttons">
        <a class="btn btn-epk" href="booking.html" rel="noopener" data-goatcounter-click="epk" data-goatcounter-title="EPK">
          <img src="https://api.iconify.design/mdi/folder-download-outline.svg?color=%23f5f5f5" alt="">
          Accéder à la page BOOKING
        </a>
      </div>

    </main>

    <!-- MODAL CONTACT -->
    <div class="modal-overlay" id="contact-modal" onclick="if(event.target===this)this.classList.remove('open')">
      <div class="modal">
        <button class="modal-close" onclick="document.getElementById('contact-modal').classList.remove('open')">×</button>
        <h2>CONTACT</h2>
        <p>Pour toute demande professionnelle (booking, presse, facture), contactez :<br>
        <a href="mailto:contact@tlmd.fr" style="color:rgba(255,255,255,0.5);">contact@tlmd.fr</a></p>
      </div>
    </div>

    <div class="modal-overlay" id="ticket-modal" onclick="if(event.target===this)this.classList.remove('open')">
      <div class="modal">
        <button class="modal-close" onclick="document.getElementById('ticket-modal').classList.remove('open')">×</button>
        <h2>BILLETTERIE</h2>
        <p>Patience! Les dates arrivent prochainement...<br>
      </div>
    </div>

    <div id="site-footer"></div>

    <!-- SCRIPTS — toujours en fin de body, pour que le DOM soit complet avant leur exécution -->
    <script src="js/actu.js"></script>
    <script>renderHomeSummary();</script>
    <script src="js/links.js"></script>
    <script>renderHotBlock(); renderListenButtons();</script>
    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
    
    <script data-goatcounter="https://tlmd.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
